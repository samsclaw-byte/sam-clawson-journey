<!-- Trak Beta Launch GANTT Chart -->
<div class="trak-gantt-card">
    <div class="trak-gantt-header">
        <h2>🚀 Trak Beta Launch GANTT</h2>
        <div class="trak-gantt-actions">
            <button class="trak-btn-primary" onclick="addTrakTask()">+ Add Task</button>
            <button class="trak-btn-secondary" onclick="resetTrakGantt()">Reset</button>
        </div>
    </div>
    
    <div class="trak-gantt-container" id="trak-gantt-container">
        <!-- GANTT rendered by JS -->
    </div>
    
    <div class="trak-gantt-legend">
        <span class="trak-legend-item"><span class="trak-status-dot not-started"></span> Not Started</span>
        <span class="trak-legend-item"><span class="trak-status-dot in-progress"></span> In Progress</span>
        <span class="trak-legend-item"><span class="trak-status-dot complete"></span> Complete</span>
        <span class="trak-legend-item"><span class="trak-status-dot blocked"></span> Blocked</span>
    </div>
</div>

<!-- Edit Task Modal -->
<div id="trak-task-modal" class="trak-modal" style="display: none;">
    <div class="trak-modal-content">
        <div class="trak-modal-header">
            <h3>✏️ Edit Task</h3>
            <button class="trak-modal-close" onclick="closeTrakModal()">×</button>
        </div>
        <form id="trak-task-form" onsubmit="saveTrakTask(event)">
            <input type="hidden" id="trak-task-index">
            
            <div class="trak-form-group">
                <label>Task Name</label>
                <input type="text" id="trak-task-name" required>
            </div>
            
            <div class="trak-form-row">
                <div class="trak-form-group">
                    <label>Start Day</label>
                    <input type="number" id="trak-task-start" min="1" max="10" required>
                </div>
                <div class="trak-form-group">
                    <label>Duration (days)</label>
                    <input type="number" id="trak-task-duration" min="1" max="10" required>
                </div>
            </div>
            
            <div class="trak-form-row">
                <div class="trak-form-group">
                    <label>Status</label>
                    <select id="trak-task-status">
                        <option value="not-started">Not Started</option>
                        <option value="in-progress">In Progress</option>
                        <option value="complete">Complete</option>
                        <option value="blocked">Blocked</option>
                    </select>
                </div>
                <div class="trak-form-group">
                    <label>Owner</label>
                    <input type="text" id="trak-task-owner" value="Sam">
                </div>
            </div>
            
            <div class="trak-form-actions">
                <button type="button" class="trak-btn-secondary" onclick="closeTrakModal()">Cancel</button>
                <button type="submit" class="trak-btn-primary">Save Task</button>
            </div>
        </form>
    </div>
</div>

<script>
// Default Trak Beta tasks
const defaultTrakTasks = [
    { id: 1, name: 'Cloudflare Setup (Pages, D1, Workers)', start: 1, duration: 1, status: 'not-started', owner: 'Sam' },
    { id: 2, name: 'D1 Database Schema', start: 2, duration: 1, status: 'not-started', owner: 'Sam' },
    { id: 3, name: 'Google OAuth Authentication', start: 2, duration: 1, status: 'not-started', owner: 'Sam' },
    { id: 4, name: 'Food Logging UI', start: 4, duration: 2, status: 'not-started', owner: 'Sam' },
    { id: 5, name: 'Daily Habits Tracker', start: 5, duration: 1, status: 'not-started', owner: 'Sam' },
    { id: 6, name: 'Macro Estimation Engine', start: 6, duration: 1, status: 'not-started', owner: 'Sam' },
    { id: 7, name: 'Dashboard & Analytics', start: 8, duration: 1, status: 'not-started', owner: 'Sam' },
    { id: 8, name: 'Settings & Profile', start: 8, duration: 1, status: 'not-started', owner: 'Sam' },
    { id: 9, name: 'Testing & QA', start: 9, duration: 1, status: 'not-started', owner: 'Sam' },
    { id: 10, name: 'Beta Launch', start: 10, duration: 1, status: 'not-started', owner: 'Sam' }
];

// Load tasks from localStorage or use defaults
function loadTrakTasks() {
    const saved = localStorage.getItem('trak-beta-tasks');
    if (saved) {
        return JSON.parse(saved);
    }
    return [...defaultTrakTasks];
}

// Save tasks to localStorage
function saveTrakTasksToStorage(tasks) {
    localStorage.setItem('trak-beta-tasks', JSON.stringify(tasks));
}

// Render GANTT
function renderTrakGantt() {
    const tasks = loadTrakTasks();
    const container = document.getElementById('trak-gantt-container');
    
    let html = '<div class="trak-gantt-chart">';
    
    // Header row with days
    html += '<div class="trak-gantt-header-row">';
    html += '<div class="trak-gantt-task-col">Task</div>';
    for (let i = 1; i <= 10; i++) {
        html += `<div class="trak-gantt-day-col ${i % 2 === 0 ? 'even' : ''}">Day ${i}</div>`;
    }
    html += '</div>';
    
    // Task rows
    tasks.forEach((task, index) => {
        const statusClass = task.status.replace('-', '');
        html += `<div class="trak-gantt-row" onclick="editTrakTask(${index})">`;
        html += `<div class="trak-gantt-task-col">${task.name}</div>`;
        
        for (let day = 1; day <= 10; day++) {
            const isActive = day >= task.start && day < task.start + task.duration;
            const cellClass = isActive ? `active ${statusClass}` : '';
            const dayContent = isActive ? `<span class="trak-day-text">${day}</span>` : '';
            html += `<div class="trak-gantt-day-col ${cellClass}">${dayContent}</div>`;
        }
        
        html += '</div>';
    });
    
    html += '</div>';
    container.innerHTML = html;
}

// Add new task
function addTrakTask() {
    const tasks = loadTrakTasks();
    const newTask = {
        id: Date.now(),
        name: 'New Task',
        start: 1,
        duration: 1,
        status: 'not-started',
        owner: 'Sam'
    };
    tasks.push(newTask);
    saveTrakTasksToStorage(tasks);
    renderTrakGantt();
    editTrakTask(tasks.length - 1);
}

// Edit task
function editTrakTask(index) {
    const tasks = loadTrakTasks();
    const task = tasks[index];
    
    document.getElementById('trak-task-index').value = index;
    document.getElementById('trak-task-name').value = task.name;
    document.getElementById('trak-task-start').value = task.start;
    document.getElementById('trak-task-duration').value = task.duration;
    document.getElementById('trak-task-status').value = task.status;
    document.getElementById('trak-task-owner').value = task.owner;
    
    document.getElementById('trak-task-modal').style.display = 'flex';
}

// Save task
function saveTrakTask(event) {
    event.preventDefault();
    
    const index = document.getElementById('trak-task-index').value;
    const tasks = loadTrakTasks();
    
    tasks[index] = {
        ...tasks[index],
        name: document.getElementById('trak-task-name').value,
        start: parseInt(document.getElementById('trak-task-start').value),
        duration: parseInt(document.getElementById('trak-task-duration').value),
        status: document.getElementById('trak-task-status').value,
        owner: document.getElementById('trak-task-owner').value
    };
    
    saveTrakTasksToStorage(tasks);
    closeTrakModal();
    renderTrakGantt();
}

// Close modal
function closeTrakModal() {
    document.getElementById('trak-task-modal').style.display = 'none';
}

// Reset to defaults
function resetTrakGantt() {
    if (confirm('Reset to default 10 tasks?')) {
        localStorage.removeItem('trak-beta-tasks');
        renderTrakGantt();
    }
}

// Initial render
renderTrakGantt();

// Close modal on outside click
document.getElementById('trak-task-modal').addEventListener('click', function(e) {
    if (e.target === this) closeTrakModal();
});
</script>
